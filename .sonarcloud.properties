# Configuración del análisis automático de SonarCloud.
# Las migraciones son PostgreSQL (Flyway): las reglas de PL/SQL de Oracle (VARCHAR2) no aplican,
# y su corrección la verifican MigrationDocumentationTest y las pruebas contra PostgreSQL real.
sonar.sources=src/main
sonar.tests=src/test
sonar.exclusions=**/db/migration/**
